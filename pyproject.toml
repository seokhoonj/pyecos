[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyecos"
version = "0.2.0"
description = "Python client for the Bank of Korea ECOS (Economic Statistics System) Open API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seokhoon Joo", email = "seokhoonj@gmail.com" }]
keywords = ["ecos", "bank of korea", "economic statistics", "korea", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ecos = "pyecos.cli:main"

[project.urls]
Homepage = "https://github.com/seokhoonj/pyecos"
Source = "https://github.com/seokhoonj/pyecos"
Issues = "https://github.com/seokhoonj/pyecos/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyecos"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated: a few indicators carry official English names longer than the line.
"src/pyecos/curation/_generated.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
