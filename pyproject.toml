[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyecos"
version = "0.1.0"
description = "Python client for the Bank of Korea ECOS (Economic Statistics System) Open API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seokhoon Joo", email = "seokhoonj@gmail.com" }]
keywords = ["ecos", "bank of korea", "economic statistics", "korea", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[project.scripts]
pyecos = "pyecos.cli:main"

[project.urls]
Homepage = "https://github.com/seokhoonj/pyecos"
Source = "https://github.com/seokhoonj/pyecos"
Issues = "https://github.com/seokhoonj/pyecos/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyecos"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
